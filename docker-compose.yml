services:
  api:
    profiles: [app]
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-}
      HTTP_ADDR: :8080
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker:
    profiles: [app]
    build: .
    entrypoint: ["/app/worker"]
    restart: unless-stopped
    environment:
      APP_ENV: development
      DATABASE_URL: ${CONTAINER_DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  postgres:
    image: postgres:17-alpine
    container_name: airline-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
