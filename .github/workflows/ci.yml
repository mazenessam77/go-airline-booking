name: backend
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: airline_test
          POSTGRES_DB: airline_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U airline_test -d airline_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://airline_test@127.0.0.1:5433/airline_ci_test?sslmode=disable
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://airline_test@127.0.0.1:5433/airline_ci_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: gosec -exclude-generated -fmt sarif -out gosec-results.sarif ./...
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('gosec-results.sarif') != '' }}
        with:
          sarif_file: gosec-results.sarif
      - run: goose -dir migrations validate
      - run: goose -dir migrations up
      - run: go test ./...
      - run: go test -race -count=1 ./...
      - run: goose -dir migrations down-to 0
      - run: goose -dir migrations up
      - run: go test -race -count=1 ./...
      - run: govulncheck ./...
      - run: go build ./cmd/...

  container-scan:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t backend:ci -f Dockerfile .
      - name: Trivy scan (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: backend:ci
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        with:
          sarif_file: trivy-results.sarif
      - name: Trivy scan (gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: backend:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"

  dast:
    needs: container-scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: airline_test
          POSTGRES_DB: airline_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U airline_test -d airline_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://airline_test@127.0.0.1:5433/airline_ci_test?sslmode=disable
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://airline_test@127.0.0.1:5433/airline_ci_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install github.com/pressly/goose/v3/cmd/goose@v3.28.0
      - run: goose -dir migrations up
      - name: Build API binary
        run: go build -o ./bin/api ./cmd/api
      - name: Start API in background
        run: |
          ./bin/api >api.log 2>&1 &
          echo "$!" >api.pid
          api_ready=false
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/readyz >/dev/null; then
              api_ready=true
              break
            fi
            sleep 1
          done
          if [ "$api_ready" != true ]; then
            cat api.log
            exit 1
          fi
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8080"
          fail_action: false
          allow_issue_writing: false
          artifact_name: zap-report
      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" 2>/dev/null || true
          fi

  deploy:
    needs: dast
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: airline-booking-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      security-events: write
    env:
      AWS_ACCOUNT_ID: "740089361110"
      AWS_REGION: us-east-1
      ECR_REPOSITORY: go-airline-booking
      EC2_INSTANCE_ID: i-086da8aaafa2b2683
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::740089361110:role/airline-booking-github-deploy
          role-session-name: airline-${{ github.run_id }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}
          mask-aws-account-id: true
          unset-current-credentials: true
      - name: Authenticate to private ECR
        uses: aws-actions/amazon-ecr-login@v2.1.6
        with:
          mask-password: true
      - name: Build immutable release image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          image="${repository}:${GITHUB_SHA}"
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${GITHUB_SHA}" >/dev/null 2>&1; then
            docker pull "$image"
            echo "push=false" >> "$GITHUB_OUTPUT"
          else
            docker build --pull \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              --tag "$image" .
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$image" >> "$GITHUB_OUTPUT"
      - name: Scan exact release image (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.image.outputs.tag }}
          format: sarif
          output: release-trivy-results.sarif
          severity: CRITICAL,HIGH
      - name: Upload release scan
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && hashFiles('release-trivy-results.sarif') != '' }}
        with:
          sarif_file: release-trivy-results.sarif
          category: release-image
      - name: Enforce release image scan gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.image.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Push release image and resolve digest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.image.outputs.push }}" = true ]; then
            docker push "${{ steps.image.outputs.tag }}"
          fi
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=${GITHUB_SHA}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "ECR returned an invalid image digest" >&2
            exit 1
          fi
          repository="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          echo "uri=${repository}@${digest}" >> "$GITHUB_OUTPUT"
      - name: Deploy through SSM
        shell: bash
        env:
          RELEASE_IMAGE: ${{ steps.release.outputs.uri }}
        run: |
          set -euo pipefail
          jq -n --arg image "$RELEASE_IMAGE" \
            '{commands: [("sudo /opt/airline/deploy.sh " + ($image | @sh))]}' \
            > ssm-parameters.json
          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "Deploy ${GITHUB_SHA}" \
            --timeout-seconds 1200 \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"
          if ! aws ssm wait command-executed \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Details:StatusDetails,Error:StandardErrorContent}'
            exit 1
          fi
          status="$(aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query Status \
            --output text)"
          if [ "$status" != "Success" ]; then
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query '{Status:Status,Details:StatusDetails,Error:StandardErrorContent}'
            exit 1
          fi
          echo "Deployed ${GITHUB_SHA} to ${EC2_INSTANCE_ID}"
