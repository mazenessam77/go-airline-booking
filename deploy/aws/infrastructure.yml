AWSTemplateFormatVersion: "2010-09-09"
Description: Least-privilege ECR and SSM demo deployment roles for the airline booking service.

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Default: i-086da8aaafa2b2683
  GitHubOIDCSubject:
    Type: String
    Default: repo:mazenessam77@184118745/go-airline-booking@1370156190:ref:refs/heads/main
    Description: Immutable GitHub OIDC subject for the main branch.
  GitHubOIDCProviderArn:
    Type: String
    Default: arn:aws:iam::740089361110:oidc-provider/token.actions.githubusercontent.com

Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: go-airline-booking
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Remove untagged images after seven days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {"type": "expire"}
              },
              {
                "rulePriority": 2,
                "description": "Keep the newest thirty tagged releases",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 30
                },
                "action": {"type": "expire"}
              }
            ]
          }

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: airline-booking-github-deploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOIDCProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubOIDCSubject
      Policies:
        - PolicyName: PushOnlyAirlineImageAndDeployOneInstance
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PushAirlineImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Sid: SendOneDeploymentCommand
                Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
                  - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}
              - Sid: ReadDeploymentResult
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                Resource: "*"

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: airline-booking-ec2
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PullOnlyAirlineImages
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ECRLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: PullAirlineImages
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt Repository.Arn

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: airline-booking-ec2
      Roles:
        - !Ref InstanceRole

Outputs:
  ECRRepositoryURI:
    Value: !GetAtt Repository.RepositoryUri
  GitHubDeployRoleArn:
    Value: !GetAtt GitHubDeployRole.Arn
  InstanceProfileName:
    Value: !Ref InstanceProfile
